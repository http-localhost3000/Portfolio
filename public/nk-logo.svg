<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9E7E1D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.4)">
        <animate attributeName="offset" values="-1; 2" dur="2.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>
  </defs>
  <!-- Background circle with gold border -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="url(#goldGradient)" stroke-width="3"/>
  <!-- Base NK text (gold) - perfectly centered -->
  <text x="50" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="url(#goldGradient)">NK</text>
  <!-- Shimmering overlay text - perfectly centered -->
  <text x="50" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="url(#shimmer)">NK</text>
</svg>
